[project]
name = "healthviz"
version = "0.1.0"
description = "Vendor-neutral local health archives"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "duckdb==1.5.6",
    "pandas==3.0.6",
    "plotly==7.1.0",
    "pydeck==0.9.3",
    "streamlit==1.65.0",
]

[project.scripts]
healthviz = "healthviz.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/healthviz"]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
