[project]
name = "healthviz"
version = "0.1.0"
description = "Vendor-neutral local health archives"
requires-python = ">=3.12"
license = "MIT"
dependencies = []

[project.scripts]
healthviz = "healthviz.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/healthviz"]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
